name: FMHY Stealth Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight (Default: Scrape Mode)
  workflow_dispatch: # Allow manual trigger
    inputs:
      scan_mode:
        description: 'Operation Mode'
        required: true
        default: 'scrape'
        type: choice
        options:
        - scrape
        - audit

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need permission to push changes

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Ecosystem
      env:
        EMAIL_NOTIFY_SENDER: ${{ secrets.EMAIL_NOTIFY_SENDER }}
        EMAIL_NOTIFY_PASSWORD: ${{ secrets.EMAIL_NOTIFY_PASSWORD }}
        EMAIL_NOTIFY_RECEIVER: ${{ secrets.EMAIL_NOTIFY_RECEIVER }}
      run: |
        # Determine mode: schedule uses 'scrape', workflow_dispatch uses input
        MODE="scrape"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          MODE="${{ github.event.inputs.scan_mode }}"
        fi

        echo "Running in $MODE mode..."
        python main.py --mode $MODE || echo "Error"

        # Only run notifier if not strictly audit?
        # Or always run notifier?
        # Audit mode updates broken_links.txt which notifier doesn't currently check.
        # Notifier checks daily JSON changes.
        # If audit run, daily JSON doesn't change.
        # So running notifier.py is harmless but maybe useless in audit mode unless we update notifier.
        # For now, keep as is.
        python notifier.py

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "🤖 Automated Scraper Update [skip ci]"
        branch: ${{ github.ref_name }}
        file_pattern: 'data/ assets/'
